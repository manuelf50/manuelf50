name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7b2ff7&color_dots=#ebedf0,#b8f5ec,#5ce6d0,#00c9b1,#00f5d4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f5d4&color_dots=#161b22,#302b63,#5a3fb5,#7b2ff7,#00f5d4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
